<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List </title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="logo.jpg" />

</head>
<body>
  <div class="navbar">
    <a href="index.html">Tasks</a>
    <a href="history.html">History</a>
    <a href="calendar.html">Calendar</a>
  </div>

  <div class="container">
    <h1>To-Do List</h1>

    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Task Description" />
      <input type="datetime-local" id="deadlineInput" />
      <select id="priorityInput" placeholder="Prioritize">
        <option value="low">Optional Task</option>
        <option value="medium">Important Task</option>
        <option value="high">Must Do Task</option>
      </select>
      <button onclick="addTask()">Add Task</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
